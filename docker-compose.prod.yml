# =============================================================================
# Star Platform - Production Docker Compose Override
# =============================================================================
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# =============================================================================

services:
  backend:
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

